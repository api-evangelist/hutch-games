name: Hutch Games
description: 'Hutch Games (Hutch) is a mobile game development studio founded in London
  with additional studios in Dundee, Scotland and Nova Scotia, Canada. Hutch specializes
  in free-to-play mobile driving and car games, developing and publishing titles including
  F1 Clash, Top Drives, and Matchcreek Motors. The studio was surfaced as a portfolio
  company of Index Ventures and added to the API Evangelist network. As a consumer
  mobile game publisher, Hutch does not currently expose a public developer API or
  developer program; this profile captures the company identity, public web properties,
  and domain-security posture.'
